[package]
name = "git-credit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "CLI for safely adding Co-authored-by trailers to your latest Git commit"
readme = "README.md"
repository = "https://github.com/dpassen/git-credit-cli"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
