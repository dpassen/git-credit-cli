[package]
name = "git-credit-cli"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "CLI for safely adding Co-authored-by trailers to your latest Git commit"
readme = "README.md"
repository = "https://github.com/dpassen/git-credit-cli"
keywords = ["git", "cli", "co-authored-by", "commit", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "git_credit"
path = "src/lib.rs"

[[bin]]
name = "git-credit"
path = "src/bin/git-credit.rs"

[[bin]]
name = "jj-credit"
path = "src/bin/jj-credit.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[lints.clippy]
format_push_string = "warn"
perf = "warn"
redundant_clone = "warn"

[lints.rust]
unsafe_code = "forbid"
